      - name: Build APK
        run: |
          cd Jarvis
          gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jarvis-${{ github.run_number }}" Jarvis/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Jarvis build ${{ github.run_number }}" --notes "Install app-debug.apk on your Android phone."
